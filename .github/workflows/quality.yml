name: Quality
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or PR cancels the outdated run.
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt runtime libraries
        # PySide6 needs libEGL; the rest of Qt's runtime is already on the runner image.
        run: |
          install="sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 libegl1"
          $install || (sudo apt-get update -o Acquire::Retries=5 && $install)
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pylint src/starlab
      - run: uv run pytest -q
