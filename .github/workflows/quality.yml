name: Quality
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or PR cancels the outdated run.
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # 24.04 ships the Qt runtime libraries (libEGL) PySide6 needs, so no apt step
    # depends on Ubuntu's package mirrors.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pylint src/starlab
      - run: uv run pytest -q
