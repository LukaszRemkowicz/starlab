name: Quality
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or PR cancels the outdated run.
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (ruff, mypy, pylint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pylint src/starlab
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    # Debian's package mirrors provide the libEGL PySide6 needs; Ubuntu's mirrors
    # were unreachable from the runners and made apt hang.
    container: debian:trixie-slim
    timeout-minutes: 15
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - name: Install Qt runtime libraries
        timeout-minutes: 3
        run: |
          apt-get update -qq -o Acquire::Retries=3
          apt-get install -y -qq --no-install-recommends ca-certificates git \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Give sources their last commit time
        # Numba reuses compiled code only when a source file's mtime is unchanged;
        # a fresh checkout would otherwise invalidate the whole cache.
        run: |
          git ls-files src | while read -r file; do
            touch -d "@$(git log -1 --format=%ct -- "$file")" "$file"
          done
      - uses: actions/cache@v4
        with:
          path: .numba-cache
          key: numba-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: numba-${{ hashFiles('uv.lock') }}-
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
