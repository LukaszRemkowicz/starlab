name: Quality
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or PR cancels the outdated run.
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    # Debian's package mirrors provide the libEGL PySide6 needs; Ubuntu's mirrors
    # were unreachable from the runners and made apt hang.
    container: debian:trixie-slim
    timeout-minutes: 15
    steps:
      - name: Install Qt runtime libraries
        timeout-minutes: 3
        run: |
          apt-get update -qq -o Acquire::Retries=3
          apt-get install -y -qq --no-install-recommends ca-certificates git \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pylint src/starlab
      - run: uv run pytest -q
